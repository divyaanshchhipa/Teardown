<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* Hosted without a trailing slash (/Divyaansh/Teardown), relative paths
   resolve one folder too high and the page loads unstyled. Add the slash
   once, before anything else loads. Skipped for file:// so opening
   index.html locally, and the tools/ checks, still work. */
if (location.protocol !== 'file:' && !/(\/|\.html)$/.test(location.pathname)) {
  location.replace(location.pathname + '/' + location.search + location.hash);
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teardown :: who owns the inside of everything</title>
<meta name="description" content="Take technology apart and see who supplies each piece, what share they hold, and how concentrated that layer really is.">
<link rel="stylesheet" href="assets/app.css">
<script>
/* Theme bootstrap. Runs before first paint so the page never flashes the
   wrong ground. Deliberately inline and dependency-free: it has to work
   before core.js exists, and build.py only rewrites <script src> tags, so
   this survives into the single-file build unchanged. */
(function () {
  var t;
  try { t = localStorage.getItem('td-theme'); } catch (e) { /* file:// may refuse */ }
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230d1b2a'/><rect x='22' y='30' width='56' height='34' rx='3' fill='none' stroke='white' stroke-width='6'/><rect x='14' y='68' width='72' height='7' rx='3' fill='%23b5822a'/></svg>">
